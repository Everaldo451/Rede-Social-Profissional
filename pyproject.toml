# Metadados do projeto e listas de dependências administradas pelo uv.
[project]
name = "rede-social-profissional"
version = "0.1.0"
requires-python = ">=3.10"
# Bibliotecas utilizadas durante a execução da aplicação.
dependencies = [
    "bcrypt",
    "email-validator",
    "neo4j-driver",
    "pymongo",
    "pydantic",
    "python-dotenv>=1.2.4",
    "redis",
    "streamlit",
    "streamlit-cookies-controller",
    "email-validator>=2.3.0",
]

# Ferramentas adicionais usadas no desenvolvimento e nos testes.
[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "playwright",
    "pytest-playwright",
]
