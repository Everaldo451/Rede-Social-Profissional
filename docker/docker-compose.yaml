name: rede-social

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - app-network

  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-none}
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - app-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-rede_social}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_AUTH: ${NEO4J_AUTH:-none}
      REDIS_HOST: ${REDIS_HOST:-redis}
    ports:
      - "8501:8501"
    depends_on:
      - mongodb
      - redis
      - neo4j
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
