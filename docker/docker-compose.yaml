# Sobe a aplicação e os três bancos na mesma rede Docker, preservando MongoDB e Neo4j em volumes.
name: rede-social

services:
  # Banco de documentos usado pelos cadastros, publicações, notificações e arquivos GridFS.
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    # A verificação de saúde confirma que o MongoDB aceita comandos.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  # Redis mantém sessões, presença e contadores de notificações.
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Neo4j armazena a rede de conexões e os demais relacionamentos profissionais.
  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jdev123}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - app-network

  # Constrói a aplicação a partir da raiz do projeto e a publica na porta 8501.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # As variáveis podem ser fornecidas pelo ambiente; os valores após :- são os padrões.
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-rede_social}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jdev123}
      REDIS_HOST: ${REDIS_HOST:-redis}
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    # A aplicação aguarda os três bancos serem considerados saudáveis.
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - app-network

# Rede interna pela qual os serviços se encontram usando seus respectivos nomes.
networks:
  app-network:
    driver: bridge

# Volumes nomeados preservam os dados desses bancos entre recriações dos containers.
volumes:
  mongodb_data:
  neo4j_data:
