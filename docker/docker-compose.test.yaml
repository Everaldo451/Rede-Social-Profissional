# Ambiente de testes com portas próprias, banco MongoDB de teste e imagem com ferramentas de desenvolvimento.
name: rede-social-test

services:
  # MongoDB utilizado pelos testes, acessível no host pela porta 27018.
  mongodb:
    image: mongo:4.4.29
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - test-network

  # Instância Redis do ambiente de testes, exposta no host pela porta 6380.
  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-network

  # Instância Neo4j dos testes com portas distintas das usadas pelo ambiente principal.
  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: "neo4j/neo4jdev123"
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4jdev123 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - test-network

  # A imagem de testes inclui pytest e Playwright e expõe o Streamlit na porta 8502 do host.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    # Configura os endereços internos dos bancos e a URL usada pelos testes de interface.
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: rede_social_test
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: neo4j
      NEO4J_AUTH: "neo4j/neo4jdev123"
      REDIS_HOST: redis
      PYTHONPATH: /app/src
      BASE_URL: http://localhost:8501
    ports:
      - "8502:8501"
    # Espera a verificação de saúde dos bancos antes de iniciar a aplicação.
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-network

# Mantém os serviços de teste em sua própria rede Docker.
networks:
  test-network:
    driver: bridge
