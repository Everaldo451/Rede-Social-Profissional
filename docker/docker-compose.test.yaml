name: rede-social-test

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - test-network

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-network

  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: "none"
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - test-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: rede_social_test
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: neo4j
      NEO4J_AUTH: "none"
      REDIS_HOST: redis
      PYTHONPATH: /app/src
      BASE_URL: http://localhost:8501
    ports:
      - "8502:8501"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
